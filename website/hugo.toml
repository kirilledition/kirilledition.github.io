baseURL = 'https://kirilledition.github.io/'
languageCode = 'en-us'
title = 'Kirill Denisov'
theme = "hello-friend-ng"

# Sitemap configuration
[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[params]
  enableThemeToggle = true
  
  description = "CV of Kirill Denisov."
  keywords = "Drug Discovery, Deep Learning, Bioinformatics, Machine Learning"
  images = [""]

  googleAnalyticsID = ""
  
    # Author information
  [params.author]
    name = "Kirill Denisov"
    
  [params.portrait]
    path     = "me.png"
    alt      = "Portrait"
    #maxWidth = "50px"

  [params.logo]
    logoMark = "<>"
    logoText = "Kirill Denisov"
    logoHomeLink = "/"
    logoCursorDisabled = true
    
  disableReadOtherPosts = true
  enableSharingButtons = false
  enableGlobalLanguageMenu = false
  
  # Custom CSS for better layout
  customCSS = ["css/custom.css"]
  
  # Favicon configuration
  [params.favicon]
    mask = "#1a1a1a"
    msapplication = "#1a1a1a"
    
  [params.footer]
    trademark = 2025
    rss = false
    copyright = false
    author = true

[services]
  [services.googleAnalytics]
    ID = ''


# Only disable unnecessary taxonomies, keep RSS for SEO
disableKinds = ["taxonomy", "taxonomyTerm"]


[[params.social]]
  name = "email"
  url  = "mailto:kirill.denisov700@gmail.com"

[[params.social]]
  name = "linkedin"
  url  = "https://www.linkedin.com/in/kirilldenisov"

[[params.social]]
  name = "X"
  url  = "https://x.com/kirilledition"

[[params.social]]
  name = "github"
  url  = "https://github.com/kirilledition"

[caches]
  [caches.images]
    dir = ':cacheDir/images'
    maxAge = "1440h"
  [caches.assets]
    dir = ':cacheDir/assets'
    maxAge = "1440h"